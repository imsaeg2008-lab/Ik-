<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#111;padding:30px;border-radius:20px;text-align:center;box-shadow:0 0 20px #444;width:320px}
.logo{width:90px;height:90px;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;margin:0 auto 15px}
button{width:100%;padding:12px;margin:8px 0;border:0;border-radius:12px;background:#222;color:#fff;font-size:18px;cursor:pointer}
button:hover{background:#444}
.modal{display:none;position:fixed;inset:0;background:#000a;justify-content:center;align-items:center}
.box{background:#111;padding:20px;border-radius:15px;width:280px}
.box a{display:block;color:#fff;text-decoration:none;background:#222;padding:10px;border-radius:10px;margin:8px 0}
</style></head><body>
<div class="card"><div class="logo">IK</div><h2>WEB DEVELOPER</h2>
<button onclick="show('wa')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
<button onclick="window.open('https://www.instagram.com/ik.dev.eg?igsh=MWlqMjlybzcxM29xbA==')"><i class="fab fa-instagram"></i> Instagram</button>
<button onclick="show('call')"><i class="fa fa-phone"></i> Call</button></div>
<div id="wa" class="modal"><div class="box"><h3>Choose WhatsApp</h3>
<a href="https://wa.me/201066517988">Number 1</a>
<a href="https://wa.me/201125093884">Number 2</a>
<button onclick="hide('wa')">Close</button></div></div>
<div id="call" class="modal"><div class="box"><h3>Choose Number</h3>
<a href="tel:+201066517988">Call 1</a>
<a href="tel:+201125093884">Call 2</a>
<button onclick="hide('call')">Close</button></div></div>
<script>
function show(id){document.getElementById(id).style.display='flex'}
function hide(id){document.getElementById(id).style.display='none'}
</script></body></html>
